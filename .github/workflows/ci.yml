name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/shared-routing-rules, feat/extended-routing-rules]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      - name: Frontend production build
        run: pnpm build

  windows:
    name: Windows tests and build
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      ROUTA_PREVIEW_PR: >-
        ${{ github.repository == 'orangestar0829/Routa' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            ((github.base_ref == 'main' && github.head_ref == 'feat/shared-routing-rules') ||
             (github.base_ref == 'feat/shared-routing-rules' && github.head_ref == 'feat/extended-routing-rules') ||
             (github.base_ref == 'feat/extended-routing-rules' && github.head_ref == 'feat/proxy-chain')) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify the pinned mihomo core
        run: pnpm fetch-mihomo
      - name: Fetch WinDivert
        run: pnpm fetch-windivert
      - name: Build ProxyBridgeCore.dll
        run: pnpm build-proxybridge
      - name: Build the process-routing service
        run: pnpm build-procsvc --locked
      - name: Build artifact regression tests
        run: node --test scripts/build-artifacts.test.mjs scripts/updater-manifest.test.mjs
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace
      - name: Real mihomo integration test
        timeout-minutes: 10
        env:
          MIHOMO_BIN: ${{ github.workspace }}\src-tauri\binaries\mihomo-x86_64-pc-windows-msvc.exe
          # Ensure curl sends loopback requests through the test's proxy.
          NO_PROXY: ''
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test e2e_real_core -- --ignored --nocapture
      - name: Build Windows application
        if: env.ROUTA_PREVIEW_PR != 'true'
        run: pnpm tauri build --no-bundle -- --locked
      - name: Build isolated Windows PR preview and NSIS installer
        if: env.ROUTA_PREVIEW_PR == 'true'
        env:
          ROUTA_SHARED_RULES_PREVIEW: '1'
        run: |
          # No stable app configuration, updater, installer identity, or
          # process-routing service/driver in this test installation.
          $config = Join-Path $env:RUNNER_TEMP 'routa-preview.tauri.json'
          @{
            productName = 'routa-preview'
            identifier = 'dev.routa.preview'
            bundle = @{
              createUpdaterArtifacts = $false
              externalBin = @('binaries/mihomo')
              resources = $null
              windows = @{ nsis = @{ installerHooks = $null } }
            }
            plugins = @{ updater = @{ endpoints = @() } }
          } | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 $config
          pnpm tauri build --bundles nsis --config $config -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Isolated Windows preview build failed" }
      - name: Verify Windows application
        run: |
          $exe = "src-tauri/target/release/routa.exe"
          if (!(Test-Path $exe)) { throw "Missing application: $exe" }
          # A Windows subsystem executable must be explicitly waited for;
          # PowerShell's direct invocation can close its output pipe early.
          $out = Join-Path $env:RUNNER_TEMP 'routa-build-info.json'
          $err = Join-Path $env:RUNNER_TEMP 'routa-build-info.stderr'
          $child = Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList '--build-info' -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          if ($child.ExitCode -ne 0) { throw "routa.exe --build-info failed with exit code $($child.ExitCode): $(Get-Content -Raw $err)" }
          $info = Get-Content -Raw $out | ConvertFrom-Json
          $expected = $env:ROUTA_PREVIEW_PR -eq 'true'
          if ($info.format -ne 'ROUTA_BUILD_INFO_V1' -or $info.preview -isnot [bool] -or $info.preview -ne $expected) {
            throw "Unexpected application build identity (expected isolated preview=$expected)"
          }
      - name: Stage unsigned PR preview packages
        id: preview-packages
        if: env.ROUTA_PREVIEW_PR == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw "Cannot identify the source commit" }
          $shortCommit = $commit.Substring(0, 12)
          $prefix = "routa-preview-$version-pr-$env:PR_NUMBER-$shortCommit"
          $assets = New-Item -ItemType Directory -Force -Path 'pr-preview'
          $stage = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'routa-preview-native')
          Copy-Item -LiteralPath 'src-tauri/target/release/routa.exe' -Destination $stage.FullName
          Copy-Item -LiteralPath 'src-tauri/binaries/mihomo-x86_64-pc-windows-msvc.exe' -Destination (Join-Path $stage.FullName 'mihomo.exe')
          $installer = @(Get-ChildItem -File 'src-tauri/target/release/bundle/nsis/routa-preview_*_x64-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one isolated preview installer, got $($installer.Count)" }
          Copy-Item -LiteralPath $installer[0].FullName -Destination (Join-Path $assets.FullName "$prefix-setup.exe")
          Compress-Archive -Path (Join-Path $stage.FullName '*') -DestinationPath (Join-Path $assets.FullName "$prefix-portable.zip")
          Get-ChildItem -File $assets.FullName | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $assets.FullName 'SHA256SUMS.txt')
          @{
            kind = 'Unsigned Windows PR preview'
            appIdentifier = 'dev.routa.preview'
            pr = $env:PR_NUMBER
            testedCommit = $commit
            headCommit = $env:PR_HEAD_SHA
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            featuresDisabled = @('stable updater', 'process-routing service/driver', 'system proxy/TUN takeover')
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $assets.FullName 'build-source.json')
          "exe=$(Join-Path $stage.FullName 'routa.exe')" >> $env:GITHUB_OUTPUT
      - name: Smoke and capture the native Routa Windows UI
        if: env.ROUTA_PREVIEW_PR == 'true'
        timeout-minutes: 8
        env:
          ROUTA_PREVIEW_EXE: ${{ steps.preview-packages.outputs.exe }}
        run: node scripts/smoke-routa-windows.mjs "$env:ROUTA_PREVIEW_EXE" 'pr-preview/screenshots'
      - name: Upload Windows PR preview and screenshot evidence
        if: ${{ !cancelled() && env.ROUTA_PREVIEW_PR == 'true' && steps.preview-packages.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routa-windows-preview-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
